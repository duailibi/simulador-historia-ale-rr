<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador ALE-RR | História de Roraima (v2)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #f0f4f8;
            --container-bg: #fff;
            --text: #1a202c;
            --heading: #0b3d5f;
            --subtitle: #2c5282;
            --border: #e2e8f0;
            --quiz-bg: #f8fafc;
            --quiz-border: #e2e8f0;
            --option-bg: #fff;
            --option-border: #d1d5db;
            --option-hover: #e6f0fa;
            --select-bg: #fff;
            --select-text: #1a202c;
            --select-border: #cbd5e0;
            --btn-bg: #0b3d5f;
            --btn-hover: #082f49;
            --score-bg: #ebf4ff;
            --score-text: #0b3d5f;
            --explanation-bg: #fff;
            --explanation-text: #2d3748;
            --feedback-correct-bg: #e6ffec;
            --feedback-correct-text: #1b4332;
            --feedback-incorrect-bg: #ffe5e5;
            --feedback-incorrect-text: #742a2a;
            --shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
        }
        body.dark-mode {
            --bg: #0f172a;
            --container-bg: #1e293b;
            --text: #e2e8f0;
            --heading: #7dd3fc;
            --subtitle: #94a3b8;
            --border: #334155;
            --quiz-bg: #0f172a;
            --quiz-border: #334155;
            --option-bg: #1e293b;
            --option-border: #334155;
            --option-hover: #334155;
            --select-bg: #334155;
            --select-text: #f1f5f9;
            --select-border: #475569;
            --btn-bg: #1e3a5f;
            --btn-hover: #162b47;
            --score-bg: #1e3a5f;
            --score-text: #bae6fd;
            --explanation-bg: #1e293b;
            --explanation-text: #cbd5e1;
            --feedback-correct-bg: #064e3b;
            --feedback-correct-text: #d1fae5;
            --feedback-incorrect-bg: #7f1d1d;
            --feedback-incorrect-text: #fee2e2;
            --shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 2rem 1rem;
            transition: background 0.3s, color 0.3s;
            color: var(--text);
        }
        .container {
            background: var(--container-bg);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 2rem;
            width: 100%;
            max-width: 800px;
            transition: background 0.3s, color 0.3s, box-shadow 0.3s;
            position: relative;
        }
        h1 {
            color: var(--heading);
            text-align: center;
            margin-bottom: 0.3rem;
            font-size: 2rem;
            letter-spacing: -0.5px;
            transition: color 0.3s;
        }
        .subtitle {
            text-align: center;
            color: var(--subtitle);
            margin-bottom: 2rem;
            font-size: 0.95rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.8rem;
            transition: color 0.3s, border-color 0.3s;
        }
        .topic-selector {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-bottom: 1.8rem;
        }
        label {
            font-weight: 600;
            color: var(--heading);
            transition: color 0.3s;
        }
        select,
        button {
            padding: 0.9rem 1.2rem;
            border-radius: 12px;
            border: 1px solid var(--select-border);
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
            background: var(--select-bg);
            color: var(--select-text);
        }
        select:focus {
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.2);
        }
        button {
            background: var(--btn-bg);
            color: #fff;
            font-weight: 600;
            border: none;
            cursor: pointer;
            letter-spacing: 0.3px;
        }
        button:hover {
            background: var(--btn-hover);
            transform: translateY(-1px);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .quiz-box {
            background: var(--quiz-bg);
            border-radius: 16px;
            padding: 1.8rem;
            margin: 1.5rem 0;
            border: 1px solid var(--quiz-border);
            transition: background 0.3s, border-color 0.3s;
        }
        .question-text {
            font-weight: 700;
            color: var(--heading);
            margin-bottom: 1.5rem;
            font-size: 1.15rem;
            line-height: 1.5;
            transition: color 0.3s;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        .option {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            background: var(--option-bg);
            padding: 0.8rem 1rem;
            border-radius: 12px;
            border: 1px solid var(--option-border);
            transition: 0.2s;
            cursor: pointer;
            color: var(--text);
        }
        .option:hover {
            background: var(--option-hover);
            border-color: #3182ce;
        }
        .option input[type="radio"] {
            accent-color: #0b3d5f;
            width: 1.1rem;
            height: 1.1rem;
            flex-shrink: 0;
        }
        .feedback {
            margin-top: 1.2rem;
            padding: 1rem;
            border-radius: 12px;
            font-weight: 500;
            display: none;
        }
        .feedback.correct {
            background: var(--feedback-correct-bg);
            border: 1px solid #38a169;
            color: var(--feedback-correct-text);
        }
        .feedback.incorrect {
            background: var(--feedback-incorrect-bg);
            border: 1px solid #e53e3e;
            color: var(--feedback-incorrect-text);
        }
        .explanation {
            margin-top: 0.7rem;
            font-style: italic;
            background: var(--explanation-bg);
            padding: 0.7rem;
            border-radius: 8px;
            color: var(--explanation-text);
        }
        .nav-buttons {
            display: flex;
            gap: 1rem;
            justify-content: space-between;
            margin-top: 1.5rem;
        }
        .score-area {
            background: var(--score-bg);
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            color: var(--score-text);
            margin-top: 0.8rem;
            transition: background 0.3s, color 0.3s;
        }
        .restart-btn {
            background: #4a5568;
        }
        .restart-btn:hover {
            background: #2d3748;
        }
        .theme-toggle {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            padding: 0.2rem;
            line-height: 1;
            transition: transform 0.2s;
        }
        .theme-toggle:hover {
            transform: scale(1.15);
        }
        @media (max-width: 500px) {
            .container {
                padding: 1.2rem;
            }
            .question-text {
                font-size: 1rem;
            }
            .theme-toggle {
                top: 1rem;
                right: 1rem;
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body class="dark-mode">
    <div class="container">
        <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema">🌙</button>
        <h1>📜 História de Roraima</h1>
        <div class="subtitle">Simulador ALE-RR · Banca FCC · Versão 2</div>
        <div id="selectorPanel">
            <div class="topic-selector">
                <label for="topicSelect">Escolha o macro-assunto:</label>
                <select id="topicSelect">
                    <option value="">-- Selecione --</option>
                    <option value="ocupacao">A ocupação territorial de Roraima</option>
                    <option value="interesses">Interesses estrangeiros na região</option>
                    <option value="presencaPortuguesa">A presença portuguesa</option>
                    <option value="vidaSeculoXIX">A vida na região no século XIX</option>
                    <option value="roraimaSecXX">Roraima no século XX</option>
                    <option value="fronteiras">A delimitação das fronteiras</option>
                    <option value="territorioFederal">A criação do Território Federal</option>
                    <option value="fluxosMigratorios">Os fluxos migratórios</option>
                    <option value="criacaoEstadoMunicipios">A criação do Estado e dos seus municípios</option>
                    <option value="patrimonios">Patrimônios históricos de Roraima</option>
                    <option value="pontosTuristicos">Pontos Turísticos</option>

                    <option value="governadores">Governadores do Território e do Estado</option>
                </select>
                <button id="startBtn">▶ Iniciar Simulado</button>
            </div>
        </div>
        <div id="quizPanel" style="display: none;">
            <div class="quiz-box">
                <div class="question-text" id="questionText"></div>
                <div class="options" id="optionsContainer"></div>
                <div class="feedback" id="feedbackBox">
                    <div id="resultMessage"></div>
                    <div class="explanation" id="explanationText"></div>
                </div>
            </div>
            <div class="nav-buttons">
                <button id="submitAnswerBtn">✅ Responder</button>
                <button id="nextBtn" style="display:none;">▶ Próxima</button>
            </div>
            <div class="score-area" id="scoreDisplay"></div>
            <button id="restartBtn" class="restart-btn" style="margin-top:1rem;">🔄 Voltar aos temas</button>
        </div>
    </div>
    <script>
        (function() {
            const qBank = [
                // ============ OCUPAÇÃO TERRITORIAL (20+) ============
                { topic: "ocupacao", question: "Qual expedição de 1639 é considerada o marco inicial da exploração portuguesa na bacia do Rio Branco?", options: ["Expedição de Lobo D'Almada", "Expedição de Pedro Teixeira", "Expedição de Robert Schomburgk", "Expedição de Joaquim Nabuco", "Expedição de Ene Garcez"], correct: 1, explanation: "Pedro Teixeira percorreu a bacia do Rio Negro e adentrou o curso do Rio Branco em 1639, sendo o marco inicial da presença portuguesa." },
                { topic: "ocupacao", question: "O Forte São Joaquim do Rio Branco foi construído entre:", options: ["1750-1755", "1775-1778", "1780-1785", "1790-1795", "1800-1805"], correct: 1, explanation: "Construído entre 1775 e 1778, na confluência dos rios Uraricoera e Tacutu, para defesa contra espanhóis e holandeses." },
                { topic: "ocupacao", question: "As três Fazendas Nacionais criadas no final do século XVIII para introduzir a pecuária foram:", options: ["São Bento (1789), São Marcos (1794) e São José (1799)", "Boa Vista (1830), São Marcos (1794) e São José (1799)", "São Bento, São Luís e São João", "São Marcos, São Joaquim e São Bento", "São José, Santa Maria e São Pedro"], correct: 0, explanation: "São Bento (1789), São Marcos (1794) e São José (1799) foram as fazendas nacionais que consolidaram a pecuária na região." },
                { topic: "ocupacao", question: "A Fazenda Boa Vista, embrião da capital, foi fundada em 1830 por:", options: ["Lobo D'Almada", "Augusto Jimenes de Vileroi", "Inácio Lopes Magalhães", "Ene Garcez", "Pedro Teixeira"], correct: 2, explanation: "O oficial cearense Inácio Lopes Magalhães, do Forte São Joaquim, fundou a Fazenda Boa Vista em 1830." },
                { topic: "ocupacao", question: "Boa Vista tornou-se município em 9 de julho de 1890, desmembrando-se de:", options: ["Manaus", "Moura", "Caracaraí", "Catrimani", "Belém"], correct: 1, explanation: "Criada pelo governador Augusto Jimenes de Vileroi, Boa Vista foi desmembrada do município de Moura, no Amazonas." },
                { topic: "ocupacao", question: "O Território Federal do Rio Branco foi criado em 1943 no governo de:", options: ["Juscelino Kubitschek", "Getúlio Vargas", "Eurico Gaspar Dutra", "João Goulart", "Castelo Branco"], correct: 1, explanation: "Getúlio Vargas criou o território pelo Decreto-Lei nº 5.812, em 13 de setembro de 1943." },
                { topic: "ocupacao", question: "O traçado urbano de Boa Vista em formato de leque (radial concêntrico) foi projetado por:", options: ["Oscar Niemeyer", "Darcy Aleixo Derenusson", "Lobo D'Almada", "Ene Garcez", "Valério Caldas"], correct: 1, explanation: "Darcy Aleixo Derenusson projetou o traçado entre 1944 e 1946, sob o governo de Ene Garcez, inspirado em Belo Horizonte e Goiânia." },
                { topic: "ocupacao", question: "A BR-174 e a BR-210 (Perimetral Norte) foram abertas durante:", options: ["O Estado Novo", "O governo JK", "O regime militar (1964-1985)", "A Nova República", "O governo Vargas"], correct: 2, explanation: "Os governos militares das décadas de 1960-70 promoveram a integração da Amazônia por meio dessas rodovias." },
                { topic: "ocupacao", question: "O PAD Anauá, projeto de colonização agrícola do INCRA, foi criado em:", options: ["1969", "1974", "1979", "1982", "1988"], correct: 2, explanation: "O Projeto de Assentamento Dirigido Anauá foi implantado em 1979, atraindo milhares de famílias, a maioria nordestinas." },
                { topic: "ocupacao", question: "Roraima foi elevado à condição de Estado pela:", options: ["Lei Complementar nº 41/1982", "Constituição Federal de 1988", "Decreto-Lei nº 5.812/1943", "Emenda Constitucional de 1991", "Lei nº 4.182/1962"], correct: 1, explanation: "A Constituição de 1988 transformou o Território Federal de Roraima em Estado da Federação." },
                { topic: "ocupacao", question: "Antes de ser município, Boa Vista foi elevada a freguesia em:", options: ["1830", "1858", "1877", "1890", "1926"], correct: 1, explanation: "Em 1858, foi criada a Freguesia de Nossa Senhora do Carmo, com sede na Fazenda Boa Vista." },
                { topic: "ocupacao", question: "A principal atividade econômica que consolidou a ocupação de Roraima desde as Fazendas Nacionais foi:", options: ["Extração de borracha", "Mineração de ouro", "Pecuária bovina", "Agricultura de soja", "Comércio fluvial"], correct: 2, explanation: "A pecuária bovina foi introduzida com as Fazendas Nacionais e se tornou a base da economia tradicional." },
                { topic: "ocupacao", question: "O Forte São Joaquim localizava-se na margem esquerda do rio:", options: ["Branco", "Uraricoera", "Tacutu", "Negro", "Cotingo"], correct: 2, explanation: "Na margem esquerda do rio Tacutu, próximo à confluência com o Uraricoera." },
                { topic: "ocupacao", question: "A Revolta da Praia do Sangue (1790) foi liderada pelo indígena:", options: ["Makunaima", "Ijamari", "Ajuricaba", "Cunhambebe", "Sepé Tiaraju"], correct: 1, explanation: "Ijamari liderou a revolta indígena de 1790 contra os maus-tratos nos aldeamentos." },
                { topic: "ocupacao", question: "Entre 1980 e 1991, a população de Roraima cresceu:", options: ["50%", "100%", "175%", "250%", "300%"], correct: 2, explanation: "Um crescimento de 175% em apenas 11 anos, 7,5 vezes maior que a média nacional." },
                { topic: "ocupacao", question: "A Fazenda São Marcos (1794) é citada como:", options: ["Primeira capital do território", "Ponto de partida para o primeiro aldeiamento da região", "Sede do governo militar", "Local da Questão do Pirara", "Primeiro hospital de Roraima"], correct: 1, explanation: "A sede da Fazenda São Marcos foi ponto de referência para o primeiro aldeiamento da região." },
                { topic: "ocupacao", question: "O município de Catrimani, criado junto com o Território Federal em 1943, corresponde hoje a:", options: ["Mucajaí", "Caracaraí", "Rorainópolis", "Bonfim", "Alto Alegre"], correct: 1, explanation: "Catrimani foi o nome original do município que, em 1955, passou a se chamar Caracaraí." },
                { topic: "ocupacao", question: "O nome 'Roraima' foi adotado em 1962 em substituição a 'Rio Branco' para:", options: ["Homenagear um político", "Evitar confusão com a capital do Acre", "Agradar a Venezuela", "Atender reivindicação indígena", "Celebrar a emancipação"], correct: 1, explanation: "A mudança visava evitar confusões postais e administrativas com Rio Branco, capital do Acre." },
                { topic: "ocupacao", question: "Em 1926, Boa Vista recebeu o foro de cidade por ato do governador do Amazonas:", options: ["Augusto Jimenes de Vileroi", "Epifânio Ferreira Sales", "Ene Garcez", "Valério Caldas", "Getúlio Vargas"], correct: 1, explanation: "Epifânio Ferreira Sales, governador do Amazonas, concedeu o foro de cidade à sede municipal de Boa Vista em 1926." },
                { topic: "ocupacao", question: "Aldeamentos indígenas no vale do Rio Branco foram usados pelos portugueses como:", options: ["Centros comerciais", "Barreira humana contra invasões estrangeiras", "Postos de mineração", "Escolas de catequese exclusiva", "Bases para exportação"], correct: 1, explanation: "Os aldeamentos serviam como barreira humana para proteger o território de invasores espanhóis e holandeses." },
                { topic: "ocupacao", question: "A expedição de Pedro Teixeira (1639) percorreu:", options: ["Apenas o Rio Amazonas", "A bacia do Rio Negro e o curso do Rio Branco", "O Rio Tocantins", "A costa do Amapá", "O Rio Madeira"], correct: 1, explanation: "Pedro Teixeira explorou a bacia do Rio Negro e adentrou o Rio Branco, iniciando a presença portuguesa." },
                { topic: "ocupacao", question: "A pecuária em Roraima no século XIX utilizava um sistema de partilha onde:", options: ["Todo gado pertencia ao fazendeiro", "A cada 4 cabeças nascidas, 1 pertencia ao vaqueiro", "O gado era dividido igualmente", "O governo ficava com 50%", "Não havia remuneração"], correct: 1, explanation: "Para estimular a permanência, a cada quatro cabeças de gado nascidas, uma pertencia ao encarregado do trato." },

                // ============ INTERESSES ESTRANGEIROS (20+) ============
                { topic: "interesses", question: "A lenda do Eldorado (cidade de Manoa) no século XVII atraiu quais povos à Amazônia?", options: ["Portugueses e espanhóis", "Holandeses e ingleses", "Franceses e alemães", "Italianos e belgas", "Suecos e dinamarqueses"], correct: 1, explanation: "Holandeses e ingleses aventuraram-se na Amazônia em busca do Eldorado, resultando em massacres de indígenas." },
                { topic: "interesses", question: "A Questão do Pirara foi uma disputa territorial entre Brasil e:", options: ["Venezuela", "França", "Grã-Bretanha", "Holanda", "Espanha"], correct: 2, explanation: "O litígio foi com a Grã-Bretanha (Guiana Britânica) por uma área de 33.200 km²." },
                { topic: "interesses", question: "O pesquisador alemão que questionou a soberania portuguesa na região do Pirara foi:", options: ["Alexander von Humboldt", "Robert Schomburgk", "Carl Friedrich Martius", "Johann Spix", "Alfred Russel Wallace"], correct: 1, explanation: "Robert Schomburgk, a serviço da coroa britânica, iniciou estudos em 1835 que questionavam a soberania na área." },
                { topic: "interesses", question: "O diplomata brasileiro que defendeu o Brasil na Questão do Pirara foi:", options: ["Barão do Rio Branco", "Joaquim Nabuco", "Rui Barbosa", "Osvaldo Aranha", "Afonso Arinos"], correct: 1, explanation: "Joaquim Nabuco produziu 18 volumes de material argumentativo para defender a posse brasileira." },
                { topic: "interesses", question: "A arbitragem da Questão do Pirara (1904) foi feita pelo rei da Itália:", options: ["Vitor Emanuel II", "Vitor Emanuel III", "Humberto I", "Carlos Alberto", "Nicolau V"], correct: 0, explanation: "Vitório Emanuel II atuou como árbitro e dividiu a área contestada." },
                { topic: "interesses", question: "Do total de 33.200 km² disputados no Pirara, o Brasil ficou com:", options: ["Todo o território", "19.630 km²", "13.570 km²", "Metade exata", "Nada"], correct: 2, explanation: "13.570 km² foram devolvidos ao Brasil, enquanto 19.630 km² ficaram com a Guiana Britânica." },
                { topic: "interesses", question: "As missões religiosas no Rio Branco foram conduzidas inicialmente pela ordem dos:", options: ["Jesuítas", "Franciscanos", "Carmelitas", "Beneditinos", "Dominicanos"], correct: 2, explanation: "Os Carmelitas atuaram na região do Rio Branco, sendo depois sucedidos pelos Beneditinos e missionários da Consolata." },
                { topic: "interesses", question: "A criação do Território Federal em 1943 foi uma resposta à:", options: ["Crise econômica", "Vulnerabilidade das fronteiras e política de segurança nacional", "Pressão da ONU", "Revolta indígena", "Descoberta de ouro"], correct: 1, explanation: "A política 'povoar para não entregar' visava evitar novos litígios como a Questão do Pirara." },
                { topic: "interesses", question: "Entre 1810 e 1811, militares do Forte São Joaquim impediram a penetração de expedições:", options: ["Espanholas", "Holandesas", "Inglesas", "Francesas", "Venezuelanas"], correct: 2, explanation: "Expedições inglesas foram barradas pelos militares do forte, demonstrando a defesa da soberania." },
                { topic: "interesses", question: "A fronteira trilíngue da América do Sul está localizada no:", options: ["Monte Caburaí", "Monte Roraima", "Serra do Tepequém", "Rio Branco", "Pico da Neblina"], correct: 1, explanation: "O Monte Roraima é a única fronteira trilíngue da América do Sul (português, espanhol e inglês)." },
                { topic: "interesses", question: "A Questão do Pirara expôs a fragilidade da soberania brasileira especialmente na região:", options: ["Sul de Roraima", "Porção nordeste do atual estado", "Fronteira com a Venezuela", "Vale do Rio Branco central", "Serra do Tepequém"], correct: 1, explanation: "A área contestada ficava na porção nordeste do atual estado de Roraima." },
                { topic: "interesses", question: "O Forte São Joaquim foi construído para proteger a região contra:", options: ["Portugueses", "Espanhóis e holandeses", "Franceses e alemães", "Belgas e suecos", "Italianos e austríacos"], correct: 1, explanation: "A defesa era contra a expansão colonial espanhola e holandesa na Amazônia setentrional." },
                { topic: "interesses", question: "Joaquim Nabuco produziu quantos volumes de material para a defesa do Brasil na Questão do Pirara?", options: ["5 volumes", "10 volumes", "18 volumes", "25 volumes", "30 volumes"], correct: 2, explanation: "Foram 18 volumes de argumentação para sustentar a posse brasileira do território." },
                { topic: "interesses", question: "A política de 'povoar para não entregar' está associada ao governo de:", options: ["Juscelino Kubitschek", "Getúlio Vargas", "João Goulart", "Castelo Branco", "Fernando Henrique"], correct: 1, explanation: "Getúlio Vargas adotou essa política nacionalista para proteger as fronteiras amazônicas." },

                { topic: "governadores", question: "O governador do Amazonas que concedeu foro de cidade a Boa Vista em 1926 foi:", options: ["Augusto Jimenes de Vileroi", "Epifânio Ferreira Sales", "Valério Caldas", "Ene Garcez", "Getúlio Vargas"], correct: 1, explanation: "Epifânio Ferreira Sales concedeu o foro de cidade à sede municipal." },
                { topic: "governadores", question: "O deputado que elaborou a lei para mudar o nome do território para Roraima em 1962 foi:", options: ["Ene Garcez", "Valério Caldas de Magalhães", "Augusto Vileroi", "Epifânio Sales", "Hélio Campos"], correct: 1, explanation: "Valério Caldas, deputado roraimense e ex-governador do Acre, propôs a mudança." },
                { topic: "governadores", question: "Getúlio Vargas criou o Território Federal do Rio Branco em:", options: ["1937", "1943", "1945", "1950", "1962"], correct: 1, explanation: "13 de setembro de 1943, pelo Decreto-Lei nº 5.812." },
                { topic: "governadores", question: "O engenheiro contratado por Ene Garcez para projetar Boa Vista foi:", options: ["Oscar Niemeyer", "Darcy Aleixo Derenusson", "Lobo D'Almada", "Valério Caldas", "Augusto Vileroi"], correct: 1, explanation: "Darcy Aleixo Derenusson projetou o traçado radial concêntrico entre 1944 e 1946." },
                { topic: "governadores", question: "Valério Caldas de Magalhães é descrito como:", options: ["Primeiro governador de Roraima", "Deputado roraimense e ex-governador do Acre", "Fundador de Boa Vista", "Construtor do Forte", "Presidente do Brasil"], correct: 1, explanation: "Foi deputado e ex-governador do Acre, responsável pela lei do nome Roraima." },
                { topic: "governadores", question: "Antes de 1943, a região do Rio Branco era governada pelo:", options: ["Presidente do Brasil", "Governador do Amazonas", "Prefeito de Boa Vista", "Governador do Pará", "Rei de Portugal"], correct: 1, explanation: "Como parte do Amazonas, era administrada pelo governador daquele estado." },
                { topic: "governadores", question: "O Decreto-Lei nº 5.812, que criou o Território, foi assinado durante:", options: ["A República Velha", "O Estado Novo", "O governo JK", "A ditadura militar", "A Nova República"], correct: 1, explanation: "Getúlio Vargas governava sob o regime do Estado Novo durante a Segunda Guerra." },
                { topic: "governadores", question: "O primeiro governador do Território era:", options: ["Civil", "Capitão de cavalaria do Exército", "Padre", "Fazendeiro", "Médico"], correct: 1, explanation: "Ene Garcez era capitão de cavalaria do Exército Brasileiro." },
                { topic: "governadores", question: "O Palácio dos Despachos, sede provisória do governo do Território, funcionava na:", options: ["Igreja Matriz", "Prelazia do Rio Branco", "Fazenda São Marcos", "Forte São Joaquim", "Colégio Lobo D'Almada"], correct: 1, explanation: "A Prelazia, construída em 1924, serviu como Palácio dos Despachos na década de 1940." },
                { topic: "governadores", question: "O planejamento urbano de Boa Vista foi inspirado em:", options: ["Paris", "Belo Horizonte e Goiânia", "Nova York", "Brasília", "Rio de Janeiro"], correct: 1, explanation: "O traçado em leque foi inspirado nas cidades planejadas de Belo Horizonte e Goiânia." },
                { topic: "governadores", question: "A criação do Território Federal visava:", options: ["Apenas desenvolvimento econômico", "Segurança nacional e proteção das fronteiras", "Expansão do agronegócio", "Criação de universidades", "Turismo"], correct: 1, explanation: "A política nacionalista de Vargas buscava 'povoar para não entregar'." },
                { topic: "governadores", question: "Antes da criação do Território em 1943, a região era:", options: ["Um estado independente", "Parte do estado do Amazonas", "Uma colônia portuguesa", "Um protetorado inglês", "Uma república"], correct: 1, explanation: "O Vale do Rio Branco pertencia ao Amazonas até 1943." },
                { topic: "governadores", question: "O Decreto nº 5.839, de 21/09/1943:", options: ["Criou o estado de Roraima", "Retificou a criação do Território Federal", "Mudou o nome para Roraima", "Criou o município de Boa Vista", "Fundou a BR-174"], correct: 1, explanation: "Poucos dias após o decreto original, o nº 5.839 retificou a criação do Território." },
                { topic: "governadores", question: "Os governadores do Território Federal eram:", options: ["Eleitos pelo povo", "Nomeados pelo Presidente da República", "Escolhidos pela Assembleia", "Indicados pelos indígenas", "Eleitos indiretamente"], correct: 1, explanation: "Como Território Federal, o governador era nomeado pelo Presidente." },
                { topic: "governadores", question: "Augusto Jimenes de Vileroi e Epifânio Ferreira Sales foram:", options: ["Governadores de Roraima", "Governadores do Amazonas", "Presidentes do Brasil", "Prefeitos de Boa Vista", "Deputados federais"], correct: 1, explanation: "Ambos foram governadores do Amazonas e tomaram decisões importantes para Boa Vista." },
                { topic: "governadores", question: "A Constituição de 1988 transformou Roraima em Estado, encerrando o período de:", options: ["Colônia", "Território Federal", "Província", "Capitania", "Regência"], correct: 1, explanation: "O status de Território Federal, iniciado em 1943, terminou com a Constituição de 1988." },
                { topic: "governadores", question: "O traçado urbano de Boa Vista em leque é um legado do governo de:", options: ["Augusto Vileroi", "Ene Garcez", "Epifânio Sales", "Valério Caldas", "Getúlio Vargas"], correct: 1, explanation: "Foi no governo de Ene Garcez que Darcy Derenusson projetou o traçado da capital." },
            ];

            // ========== LÓGICA ==========
            const topicSelect = document.getElementById('topicSelect');
            const startBtn = document.getElementById('startBtn');
            const selectorPanel = document.getElementById('selectorPanel');
            const quizPanel = document.getElementById('quizPanel');
            const questionText = document.getElementById('questionText');
            const optionsContainer = document.getElementById('optionsContainer');
            const feedbackBox = document.getElementById('feedbackBox');
            const resultMessage = document.getElementById('resultMessage');
            const explanationText = document.getElementById('explanationText');
            const submitBtn = document.getElementById('submitAnswerBtn');
            const nextBtn = document.getElementById('nextBtn');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const restartBtn = document.getElementById('restartBtn');
            const themeToggle = document.getElementById('themeToggle');
            let currentQuestions = [],
                currentIndex = 0,
                score = 0,
                answered = false,
                selectedOption = null;

            function applyTheme(dark) {
                if (dark) { document.body.classList.add('dark-mode');
                    themeToggle.textContent = '☀️';
                    localStorage.setItem('theme', 'dark'); } else { document.body.classList.remove(
                    'dark-mode');
                    themeToggle.textContent = '🌙';
                    localStorage.setItem('theme', 'light'); }
            }
            const saved = localStorage.getItem('theme');
            applyTheme(saved !== 'light');
            themeToggle.addEventListener('click', () => applyTheme(!document.body.classList.contains(
                'dark-mode')));

            function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (
                    i + 1));
                    [a[i], a[j]] = [a[j], a[i]]; } }

            function prepare(raw) { return raw.map(q => { const ord = [0, 1, 2, 3, 4];
                    shuffle(ord); return { ...q, options: ord.map(i => q.options[i]), correct: ord.indexOf(q
                            .correct) }; }); }

            function startQuiz() {
                const topic = topicSelect.value;
                if (!topic) return alert('Selecione um macro-assunto.');
                const filt = qBank.filter(q => q.topic === topic);
                if (filt.length < 20) alert(`Este tópico possui ${filt.length} questões.`);
                currentQuestions = prepare(filt);
                shuffle(currentQuestions);
                currentIndex = 0;
                score = 0;
                answered = false;
                selectorPanel.style.display = 'none';
                quizPanel.style.display = 'block';
                updateScore();
                showQ();
            }

            function showQ() {
                if (currentIndex >= currentQuestions.length) return finish();
                answered = false;
                selectedOption = null;
                submitBtn.style.display = 'inline-block';
                nextBtn.style.display = 'none';
                feedbackBox.style.display = 'none';
                feedbackBox.className = 'feedback';
                const q = currentQuestions[currentIndex];
                questionText.textContent = `${currentIndex+1}. ${q.question}`;
                optionsContainer.innerHTML = '';
                q.options.forEach((opt, i) => {
                    const lbl = document.createElement('label');
                    lbl.className = 'option';
                    const r = document.createElement('input');
                    r.type = 'radio';
                    r.name = 'q';
                    r.value = i;
                    r.addEventListener('change', () => selectedOption = i);
                    lbl.appendChild(r);
                    lbl.appendChild(document.createTextNode(opt));
                    optionsContainer.appendChild(lbl);
                });
                window.scrollTo({ top: quizPanel.offsetTop - 50, behavior: 'smooth' });
            }

            function submit() {
                if (answered || selectedOption === null) return alert('Selecione uma alternativa.');
                const q = currentQuestions[currentIndex];
                const ok = selectedOption === q.correct;
                if (ok) { score++;
                    resultMessage.textContent = '✅ Correto!';
                    feedbackBox.className = 'feedback correct'; } else { resultMessage.textContent =
                        '❌ Incorreto!';
                    feedbackBox.className = 'feedback incorrect'; }
                explanationText.textContent = `Resposta correta: ${q.options[q.correct]}. ${q.explanation}`;
                feedbackBox.style.display = 'block';
                document.querySelectorAll('.option').forEach((o, i) => {
                    const rb = o.querySelector('input');
                    if (i === q.correct) { o.style.backgroundColor = 'var(--feedback-correct-bg)';
                        o.style.borderColor = '#38a169'; } else if (i === selectedOption && !ok) { o.style
                            .backgroundColor = 'var(--feedback-incorrect-bg)';
                        o.style.borderColor = '#e53e3e'; }
                    rb.disabled = true;
                });
                answered = true;
                submitBtn.style.display = 'none';
                nextBtn.style.display = 'inline-block';
                updateScore();
            }

            function next() { currentIndex++;
                showQ(); }

            function updateScore() { scoreDisplay.textContent = `Pontuação: ${score} / ${currentQuestions.length}`; }

            function finish() {
                questionText.textContent = 'Simulado concluído! 🎉';
                optionsContainer.innerHTML = '';
                feedbackBox.style.display = 'none';
                submitBtn.style.display = 'none';
                nextBtn.style.display = 'none';
                scoreDisplay.textContent = `Resultado final: ${score} de ${currentQuestions.length} questões.`;
            }

            function restart() {
                currentQuestions = [];
                currentIndex = 0;
                score = 0;
                answered = false;
                quizPanel.style.display = 'none';
                selectorPanel.style.display = 'block';
                topicSelect.value = '';
                scoreDisplay.textContent = '';
            }
            startBtn.addEventListener('click', startQuiz);
            submitBtn.addEventListener('click', submit);
            nextBtn.addEventListener('click', next);
            restartBtn.addEventListener('click', restart);
        })();
    </script>
</body>
</html>
