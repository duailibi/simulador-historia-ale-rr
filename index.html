<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador ALE-RR - História de Roraima</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 2rem 1rem;
            transition: background 0.3s, color 0.3s;
            color: #1a202c;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            padding: 2rem;
            width: 100%;
            max-width: 800px;
            transition: background 0.3s, color 0.3s, box-shadow 0.3s;
            position: relative;
        }
        h1 {
            color: #0b3d5f;
            text-align: center;
            margin-bottom: 0.3rem;
            font-size: 2rem;
            letter-spacing: -0.5px;
            transition: color 0.3s;
        }
        .subtitle {
            text-align: center;
            color: #2c5282;
            margin-bottom: 2rem;
            font-size: 0.95rem;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 0.8rem;
            transition: color 0.3s, border-color 0.3s;
        }
        .topic-selector {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-bottom: 1.8rem;
        }
        label {
            font-weight: 600;
            color: #1a365d;
            transition: color 0.3s;
        }
        select, button {
            padding: 0.9rem 1.2rem;
            border-radius: 12px;
            border: 1px solid #cbd5e0;
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
            background: white;
            color: #1a202c;
        }
        select:focus {
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(49,130,206,0.2);
        }
        button {
            background: #0b3d5f;
            color: white;
            font-weight: 600;
            border: none;
            cursor: pointer;
            letter-spacing: 0.3px;
        }
        button:hover {
            background: #082f49;
            transform: translateY(-1px);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .quiz-box {
            background: #f8fafc;
            border-radius: 16px;
            padding: 1.8rem;
            margin: 1.5rem 0;
            border: 1px solid #e2e8f0;
            transition: background 0.3s, border-color 0.3s;
        }
        .question-text {
            font-weight: 700;
            color: #0b3d5f;
            margin-bottom: 1.5rem;
            font-size: 1.15rem;
            line-height: 1.5;
            transition: color 0.3s;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        .option {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            background: white;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            border: 1px solid #d1d5db;
            transition: 0.2s;
            cursor: pointer;
            color: #1a202c;
        }
        .option:hover {
            background: #e6f0fa;
            border-color: #3182ce;
        }
        .option input[type="radio"] {
            accent-color: #0b3d5f;
            width: 1.1rem;
            height: 1.1rem;
        }
        .feedback {
            margin-top: 1.2rem;
            padding: 1rem;
            border-radius: 12px;
            font-weight: 500;
            display: none;
        }
        .feedback.correct {
            background: #e6ffec;
            border: 1px solid #38a169;
            color: #1b4332;
        }
        .feedback.incorrect {
            background: #ffe5e5;
            border: 1px solid #e53e3e;
            color: #742a2a;
        }
        .explanation {
            margin-top: 0.7rem;
            font-style: italic;
            background: white;
            padding: 0.7rem;
            border-radius: 8px;
            color: #2d3748;
        }
        .nav-buttons {
            display: flex;
            gap: 1rem;
            justify-content: space-between;
            margin-top: 1.5rem;
        }
        .score-area {
            background: #ebf4ff;
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            color: #0b3d5f;
            margin-top: 0.8rem;
            transition: background 0.3s, color 0.3s;
        }
        .restart-btn {
            background: #4a5568;
        }
        .restart-btn:hover {
            background: #2d3748;
        }
        /* Dark mode toggle button */
        .theme-toggle {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            padding: 0.2rem;
            line-height: 1;
            transition: transform 0.2s;
            background: transparent;
            color: inherit;
        }
        .theme-toggle:hover {
            transform: scale(1.15);
        }

        /* Dark mode styles */
        body.dark-mode {
            background: #0f172a;
            color: #e2e8f0;
        }
        body.dark-mode .container {
            background: #1e293b;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }
        body.dark-mode h1 {
            color: #7dd3fc;
        }
        body.dark-mode .subtitle {
            color: #94a3b8;
            border-bottom-color: #334155;
        }
        body.dark-mode label {
            color: #cbd5e1;
        }
        body.dark-mode select,
        body.dark-mode button {
            background: #334155;
            color: #f1f5f9;
            border-color: #475569;
        }
        body.dark-mode select:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56,189,248,0.3);
        }
        body.dark-mode button {
            background: #1e3a5f;
        }
        body.dark-mode button:hover {
            background: #162b47;
        }
        body.dark-mode .quiz-box {
            background: #0f172a;
            border-color: #334155;
        }
        body.dark-mode .question-text {
            color: #bae6fd;
        }
        body.dark-mode .option {
            background: #1e293b;
            border-color: #334155;
            color: #e2e8f0;
        }
        body.dark-mode .option:hover {
            background: #334155;
            border-color: #38bdf8;
        }
        body.dark-mode .feedback.correct {
            background: #064e3b;
            border-color: #10b981;
            color: #d1fae5;
        }
        body.dark-mode .feedback.incorrect {
            background: #7f1d1d;
            border-color: #ef4444;
            color: #fee2e2;
        }
        body.dark-mode .explanation {
            background: #1e293b;
            color: #cbd5e1;
        }
        body.dark-mode .score-area {
            background: #1e3a5f;
            color: #bae6fd;
        }
        body.dark-mode .restart-btn {
            background: #475569;
        }
        body.dark-mode .restart-btn:hover {
            background: #64748b;
        }

        @media (max-width: 500px) {
            .container {
                padding: 1.2rem;
            }
            .question-text {
                font-size: 1rem;
            }
            .theme-toggle {
                top: 1rem;
                right: 1rem;
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body class="dark-mode">
<div class="container">
    <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema">🌙</button>
    <h1>📜 História de Roraima</h1>
    <div class="subtitle">Simulador para concurso ALE-RR · Banca FCC</div>

    <div id="selectorPanel">
        <div class="topic-selector">
            <label for="topicSelect">Escolha o macro-assunto:</label>
            <select id="topicSelect">
                <option value="">-- Selecione --</option>
                <option value="ocupacao">A ocupação territorial de Roraima</option>
                <option value="interesses">Interesses estrangeiros na região</option>
                <option value="presencaPortuguesa">A presença portuguesa</option>
                <option value="vidaSeculoXIX">A vida na região no século XIX</option>
                <option value="roraimaSecXX">Roraima no século XX</option>
                <option value="fronteiras">A delimitação das fronteiras</option>
                <option value="territorioFederal">A criação do Território Federal</option>
                <option value="fluxosMigratorios">Os fluxos migratórios</option>
                <option value="criacaoEstadoMunicipios">A criação do Estado e dos seus municípios</option>
                <option value="patrimonios">Patrimônios históricos de Roraima</option>
                <option value="pontosTuristicos">Pontos Turísticos</option>
                <option value="terrasIndigenas">Terras indígenas / Povos indígenas de Roraima</option>
                <option value="governadoresTerritorio">Governadores do Território Federal de Roraima</option>
                <option value="governadoresEstado">Governadores do Estado de Roraima</option>
            </select>
            <button id="startBtn">▶ Iniciar Simulado</button>
        </div>
    </div>

    <div id="quizPanel" style="display: none;">
        <div class="quiz-box">
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsContainer"></div>
            <div class="feedback" id="feedbackBox">
                <div id="resultMessage"></div>
                <div class="explanation" id="explanationText"></div>
            </div>
        </div>
        <div class="nav-buttons">
            <button id="submitAnswerBtn" class="submit-btn">✅ Responder</button>
            <button id="nextBtn" style="display: none;">▶ Próxima</button>
        </div>
        <div class="score-area" id="scoreDisplay"></div>
        <button id="restartBtn" class="restart-btn" style="margin-top: 1rem;">🔄 Voltar aos temas</button>
    </div>
</div>

<script>
    // ========== BANCO DE QUESTÕES ==========
    const questionBank = [
        // ---------- A OCUPAÇÃO TERRITORIAL DE RORAIMA (20) ----------
        { topic: "ocupacao", question: "Qual foi o primeiro núcleo da ocupação portuguesa no vale do Rio Branco?", options: ["A missão carmelita de Nossa Senhora do Carmo", "O Forte de São Joaquim, fundado em 1775", "A Fazenda Boa Vista, de Inácio Lopes de Magalhães", "O aldeamento de São Marcos", "A cidade de Caracaraí"], correct: 1, explanation: "O Forte São Joaquim, erguido em 1775 na confluência dos rios Tacutu e Uraricoera, foi o primeiro núcleo da ocupação portuguesa na região." },
        { topic: "ocupacao", question: "O que foi a Revolta da Praia de Sangue (1835-1836)?", options: ["Um conflito entre portugueses e espanhóis pelo controle do rio Branco", "Uma rebelião indígena contra abusos coloniais no rio Uraricoera", "Uma disputa entre fazendeiros e garimpeiros na região sul", "Uma revolta de vaqueiros nordestinos contra a cobrança de impostos", "Um levante militar contra a nomeação do governador do Amazonas"], correct: 1, explanation: "A Revolta da Praia de Sangue ocorreu entre 1835 e 1836 no rio Uraricoera, motivada por abusos coloniais contra os povos indígenas." },
        { topic: "ocupacao", question: "Qual a principal finalidade dos aldeamentos carmelitas no século XVIII em Roraima?", options: ["Extração de ouro e diamantes", "Catequese e controle territorial dos indígenas", "Defesa contra ataques holandeses", "Criação de gado em larga escala", "Construção de estradas para integrar a região"], correct: 1, explanation: "Os aldeamentos carmelitas foram utilizados como estratégia de catequese e controle territorial, fixando populações indígenas e expandindo a presença portuguesa." },
        { topic: "ocupacao", question: "A partir de que ano o INCRA iniciou projetos de assentamentos no sul de Roraima?", options: ["1965", "1970", "1980", "1990", "2000"], correct: 2, explanation: "O INCRA começou a implantar projetos de assentamento no sul de Roraima a partir de 1980, estimulando a ocupação agrícola da região." },
        { topic: "ocupacao", question: "Quando os garimpeiros começaram a invadir o território Yanomami de forma intensa?", options: ["Década de 1950", "Década de 1960", "Década de 1970", "Década de 1980", "Década de 1990"], correct: 3, explanation: "A invasão garimpeira em terras Yanomami intensificou-se a partir de 1980, causando grave crise sanitária e conflitos." },
        { topic: "ocupacao", question: "A BR-174, fundamental para a integração de Roraima, foi aberta em que década?", options: ["1950", "1960", "1970", "1980", "1990"], correct: 2, explanation: "A BR-174 foi aberta nos anos 1970, ligando Manaus a Boa Vista e, posteriormente, à Venezuela, quebrando o isolamento fluvial." },
        { topic: "ocupacao", question: "Qual rodovia, projetada como parte da integração nacional durante o governo militar, ficou conhecida como Perimetral Norte?", options: ["BR-174", "BR-210", "BR-401", "BR-319", "BR-156"], correct: 1, explanation: "A Perimetral Norte (BR-210) foi um projeto do governo militar para integrar as regiões norte e nordeste do país, passando por Roraima." },
        { topic: "ocupacao", question: "Em que ano Boa Vista foi transformada em município, ainda subordinado ao estado do Amazonas?", options: ["1858", "1887", "1890", "1904", "1943"], correct: 2, explanation: "Boa Vista tornou-se município em 9 de julho de 1890, pelo governador amazonense Augusto Ximeno de Ville Roy, com o nome de Boa Vista do Rio Branco." },
        { topic: "ocupacao", question: "Quem introduziu o gado nos lavrados de Roraima no final do século XVIII?", options: ["Capitão Inácio Lopes de Magalhães", "Ene Garcez", "Lobo D'Almada", "Getúlio Vargas", "Ottomar Pinto"], correct: 2, explanation: "O brigadeiro português Manuel da Gama Lobo D'Almada introduziu gado bovino e equino no vale do Rio Branco a partir de 1789." },
        { topic: "ocupacao", question: "A Fazenda Boa Vista, embrião da capital, foi fundada por Inácio Lopes de Magalhães em que ano?", options: ["1775", "1830", "1858", "1890", "1904"], correct: 1, explanation: "O capitão Inácio Lopes de Magalhães fundou a Fazenda Boa Vista em 1830, que deu origem à atual capital de Roraima." },
        { topic: "ocupacao", question: "Qual era o principal meio de transporte para o Vale do Rio Branco antes da abertura das rodovias?", options: ["Ferrovia", "Avião", "Barcos pelos rios Negro e Branco", "Tropas de mulas", "Veículos off-road"], correct: 2, explanation: "Até a construção da BR-174, o acesso era feito quase exclusivamente por barcos que subiam o Rio Negro e o Rio Branco, viagem que durava semanas." },
        { topic: "ocupacao", question: "O que eram as “tropas de resgate” no contexto da exploração portuguesa no século XVII?", options: ["Equipes de resgate de náufragos", "Expedições para capturar indígenas para trabalho escravo", "Grupos de defesa contra invasores estrangeiros", "Caravanas comerciais de drogas do sertão", "Missões de assistência médica"], correct: 1, explanation: "As “tropas de resgate” eram expedições portuguesas que percorriam o vale do Rio Branco para aprisionar indígenas, uma prática comum no início da colonização." },
        { topic: "ocupacao", question: "Qual foi o principal efeito da abertura da BR-174 para Boa Vista?", options: ["Diminuição da população", "Isolamento ainda maior", "Fim da dependência do transporte fluvial e crescimento do comércio terrestre", "Redução da migração nordestina", "Fechamento de fazendas de gado"], correct: 2, explanation: "A BR-174 eliminou o isolamento fluvial e permitiu a expansão do comércio rodoviário e o crescimento econômico de Roraima." },
        { topic: "ocupacao", question: "Em que ano o povoado de Boa Vista foi elevado à categoria de freguesia com o nome de Nossa Senhora do Carmo?", options: ["1830", "1858", "1887", "1890", "1943"], correct: 1, explanation: "Em 1858, a povoação ao redor da Fazenda Boa Vista tornou-se a freguesia de Nossa Senhora do Carmo." },
        { topic: "ocupacao", question: "Qual foi a primeira capital da Capitania de São José do Rio Negro, antecessora administrativa de Roraima?", options: ["Boa Vista", "Manaus", "Barcelos", "Caracaraí", "Forte São Joaquim"], correct: 2, explanation: "A capital original da capitania era Barcelos; mais tarde foi transferida para a barra do Rio Negro (atual Manaus) por Lobo D'Almada." },
        { topic: "ocupacao", question: "Qual era a população não indígena de Boa Vista em 1887?", options: ["Cerca de 100 habitantes", "Cerca de 500 habitantes", "Cerca de 1.000 habitantes", "Cerca de 5.000 habitantes", "Cerca de 10.000 habitantes"], correct: 2, explanation: "Em 1887, a população de Boa Vista era de aproximadamente mil habitantes, composta principalmente por militares, vaqueiros cearenses e mamelucos." },
        { topic: "ocupacao", question: "O Forte de São Joaquim foi construído na confluência de quais rios?", options: ["Rio Branco e Rio Negro", "Rio Uraricoera e Rio Tacutu", "Rio Maú e Rio Tacutu", "Rio Cauamé e Rio Branco", "Rio Mucajaí e Rio Branco"], correct: 1, explanation: "O forte foi erguido onde os rios Uraricoera e Tacutu se encontram para formar o Rio Branco, ponto estratégico para defesa." },
        { topic: "ocupacao", question: "A colonização efetiva do Vale do Rio Branco ocorreu tardiamente, motivada principalmente por:", options: ["Descoberta de ouro", "Necessidade de proteger a fronteira norte contra invasões estrangeiras", "Expansão da borracha", "Solicitação de povos indígenas", "Construção de ferrovias"], correct: 1, explanation: "A ocupação portuguesa foi acelerada no século XVIII para defender a região de espanhóis, ingleses e holandeses, garantindo a posse pelo uti possidetis." },
        { topic: "ocupacao", question: "Durante o governo militar, qual projeto de rodovia pretendia integrar Roraima ao Amapá e ao Pará?", options: ["BR-174", "BR-401", "BR-432", "BR-210 (Perimetral Norte)", "Transamazônica"], correct: 3, explanation: "A Perimetral Norte (BR-210) foi planejada para ligar o extremo norte, mas nunca foi totalmente concluída." },
        { topic: "ocupacao", question: "O que foi a “Praia de Sangue”?", options: ["Uma batalha entre portugueses e ingleses nas margens do Rio Branco", "Uma epidemia de malária que dizimou indígenas", "Uma revolta indígena em 1835-1836 devido a abusos coloniais", "Um massacre de garimpeiros na década de 1980", "O nome dado à fundação do Forte São Joaquim"], correct: 2, explanation: "A “Revolta da Praia de Sangue” foi um levante indígena contra os maus-tratos dos colonizadores, ocorrido no rio Uraricoera entre 1835 e 1836." },

        // ---------- INTERESSES ESTRANGEIROS NA REGIÃO (20) ----------
        { topic: "interesses", question: "A Questão do Pirara foi uma disputa territorial entre o Brasil e qual país?", options: ["França", "Holanda", "Inglaterra", "Espanha", "Venezuela"], correct: 2, explanation: "A Questão do Pirara envolveu o Brasil e a Inglaterra (Guiana Inglesa) pela posse da região do rio Pirara." },
        { topic: "interesses", question: "Quem arbitrou a Questão do Pirara em 1904?", options: ["Papa Leão XIII", "Rei da Itália Vitor Emanuel III", "Presidente dos EUA Theodore Roosevelt", "Rainha Vitória", "Tribunal de Haia"], correct: 1, explanation: "A arbitragem foi confiada ao rei da Itália, Vitor Emanuel III, que decidiu dividir o território disputado." },
        { topic: "interesses", question: "Qual foi o resultado da arbitragem de 1904 para o Brasil na Questão do Pirara?", options: ["O Brasil ficou com todo o território", "O Brasil perdeu cerca de 19 mil km² dos 33 mil km² em disputa", "A Inglaterra devolveu toda a área", "O território foi dividido igualmente", "A disputa foi encaminhada à Liga das Nações"], correct: 1, explanation: "O Brasil ficou com cerca de 14 mil km² e a Inglaterra com 19 mil km², uma decisão considerada desfavorável ao Brasil." },
        { topic: "interesses", question: "O diplomata brasileiro que defendeu o Brasil na Questão do Pirara foi:", options: ["Barão do Rio Branco", "Joaquim Nabuco", "Rui Barbosa", "Osvaldo Aranha", "Afonso Pena"], correct: 1, explanation: "Joaquim Nabuco representou o Brasil na arbitragem e ficou profundamente frustrado com a perda territorial." },
        { topic: "interesses", question: "Além da Inglaterra, quais outros países europeus demonstraram interesse na região do Rio Branco nos séculos XVII e XVIII?", options: ["França e Alemanha", "Holanda e Espanha", "Portugal e Itália", "Suécia e Dinamarca", "Bélgica e Áustria"], correct: 1, explanation: "Holandeses e espanhóis também cobiçavam a região, além dos ingleses, exigindo a construção de fortes pelos portugueses." },
        { topic: "interesses", question: "O que motivou a presença de missionários ingleses na região de Roraima no século XIX?", options: ["Exploração de ouro", "Catequese de indígenas e denúncia de maus-tratos", "Construção de estradas", "Comércio de borracha", "Instalação de bases militares"], correct: 1, explanation: "Missionários como Thomas Youd atuaram na fronteira, gerando tensões diplomáticas ao denunciar abusos contra indígenas." },
        { topic: "interesses", question: "A perda territorial na Questão do Pirara significou para o Brasil:", options: ["Acesso ao Oceano Pacífico", "Perda do acesso direto à bacia do Rio Essequibo", "Incorporação da Guiana Inglesa", "Fim das fronteiras com a Venezuela", "Nenhuma alteração"], correct: 1, explanation: "O Brasil perdeu o acesso direto à bacia do Rio Essequibo, área que passou ao controle britânico." },
        { topic: "interesses", question: "Qual princípio diplomático foi utilizado por Portugal e depois pelo Brasil para assegurar a posse da região do Rio Branco?", options: ["Uti possidetis", "Mare liberum", "Pacta sunt servanda", "Jus sanguinis", "Jus soli"], correct: 0, explanation: "O princípio do uti possidetis (quem ocupa tem a posse) foi fundamental para consolidar a soberania brasileira na região." },
        { topic: "interesses", question: "As incursões holandesas no vale do Rio Branco ocorreram principalmente a partir de:", options: ["Belém", "Costa do Maranhão", "Suriname (Guiana Holandesa)", "Venezuela", "Caribe"], correct: 2, explanation: "Os holandeses, estabelecidos no Suriname, tentaram expandir seu domínio para o vale do Rio Branco." },
        { topic: "interesses", question: "O que a arbitragem de 1904 representou para a política brasileira em relação à Amazônia?", options: ["Desinteresse pela região", "Reforço da ideia de 'integrar para não entregar'", "Aceitação de todas as perdas territoriais", "Criação de novos estados", "Fim das missões religiosas"], correct: 1, explanation: "A perda reforçou a necessidade de ocupar e desenvolver a região para evitar novas perdas territoriais." },
        { topic: "interesses", question: "A fronteira com a Guiana, resultante da Questão do Pirara, é delimitada principalmente pelos rios:", options: ["Amazonas e Negro", "Maú e Tacutu", "Branco e Uraricoera", "Cotingo e Surumu", "Parima e Cauamé"], correct: 1, explanation: "Os rios Maú e Tacutu servem como linha de fronteira entre o Brasil e a Guiana na região leste de Roraima." },
        { topic: "interesses", question: "Qual foi o papel das missões religiosas estrangeiras no século XIX em relação à disputa territorial?", options: ["Auxiliaram o Brasil na demarcação", "Criaram atritos ao questionar a soberania brasileira", "Promoveram a integração pacífica", "Introduziram a pecuária", "Fundaram a cidade de Bonfim"], correct: 1, explanation: "Missionários ingleses questionavam a autoridade brasileira sobre indígenas, gerando tensões que influenciaram a disputa do Pirara." },
        { topic: "interesses", question: "A expressão 'integrar para não entregar' está associada a qual contexto histórico em Roraima?", options: ["Criação do estado em 1988", "Construção da BR-174", "Criação dos territórios federais por Vargas", "Questão do Pirara e defesa da fronteira", "Chegada dos venezuelanos"], correct: 2, explanation: "Embora o lema seja do período Vargas, a ideia de ocupar para não perder território já vinha da experiência da Questão do Pirara." },
        { topic: "interesses", question: "Em que ano o Rei da Itália proferiu a sentença sobre a Questão do Pirara?", options: ["1898", "1904", "1910", "1900", "1889"], correct: 1, explanation: "A sentença arbitral de Vitor Emanuel III foi dada em 1904, definindo os limites entre Brasil e Guiana Inglesa." },
        { topic: "interesses", question: "Qual era o principal interesse econômico estrangeiro na região do Rio Branco nos séculos XVIII e XIX?", options: ["Ouro e diamantes", "Pecuária e couro", "Drogas do sertão e mão de obra indígena", "Borracha", "Petróleo"], correct: 2, explanation: "Os europeus buscavam drogas do sertão (especiarias) e indígenas para escravização, além de controlar rotas fluviais." },
        { topic: "interesses", question: "A presença de espanhóis na fronteira norte de Roraima se dava principalmente a partir de:", options: ["Guiana", "Suriname", "Venezuela", "Colômbia", "Peru"], correct: 2, explanation: "Os espanhóis avançavam a partir da Capitania Geral da Venezuela, disputando a região com os portugueses." },
        { topic: "interesses", question: "Qual fortificação foi erguida pelos portugueses justamente para conter os interesses estrangeiros no vale do Rio Branco?", options: ["Forte do Príncipe da Beira", "Forte de São Joaquim", "Forte de São Gabriel", "Forte de Macapá", "Forte do Castelo"], correct: 1, explanation: "O Forte de São Joaquim, construído em 1775, foi a principal defesa contra invasões de espanhóis, holandeses e ingleses." },
        { topic: "interesses", question: "Após a arbitragem de 1904, a região do Pirara passou a pertencer a qual país?", options: ["Brasil", "Venezuela", "Guiana (Inglaterra)", "Holanda", "França"], correct: 2, explanation: "A maior parte da área disputada ficou sob controle da Guiana Inglesa, atual República Cooperativa da Guiana." },
        { topic: "interesses", question: "Os conflitos entre missionários estrangeiros e autoridades brasileiras no século XIX ocorreram principalmente na região do:", options: ["Rio Branco", "Rio Pirara e fronteira com a Guiana", "Alto Rio Negro", "Lavrado", "Sul de Roraima"], correct: 1, explanation: "A região do Pirara, na fronteira com a Guiana, foi palco de tensões envolvendo missionários ingleses." },
        { topic: "interesses", question: "A arbitragem italiana de 1904 foi motivada pela incapacidade de acordo direto entre Brasil e Inglaterra sobre:", options: ["Navegação no Amazonas", "Limites na região do Pirara", "Comércio de borracha", "Extradição de criminosos", "Construção de ferrovias"], correct: 1, explanation: "A disputa territorial na região do rio Pirara levou as duas nações a solicitar uma arbitragem internacional." },

        // ---------- A PRESENÇA PORTUGUESA (20) ----------
        { topic: "presencaPortuguesa", question: "Em que ano foi construído o Forte de São Joaquim, marco da presença portuguesa em Roraima?", options: ["1700", "1750", "1775", "1800", "1822"], correct: 2, explanation: "O Forte de São Joaquim foi erguido em 1775, consolidando a ocupação lusa no vale do Rio Branco." },
        { topic: "presencaPortuguesa", question: "Qual foi a principal contribuição de Lobo D'Almada para o desenvolvimento de Roraima?", options: ["Construção de estradas", "Introdução do gado bovino e equino nos lavrados", "Descoberta de ouro", "Fundação de Boa Vista", "Criação do Território Federal"], correct: 1, explanation: "Manuel da Gama Lobo D'Almada introduziu o gado a partir de 1789, fundando fazendas como São Bento e São Marcos." },
        { topic: "presencaPortuguesa", question: "As expedições portuguesas no vale do Rio Branco a partir de 1670 tinham como objetivo inicial:", options: ["Plantar café", "Explorar ouro", "Capturar indígenas ('tropas de resgate') e coletar drogas do sertão", "Construir cidades", "Evangelizar"], correct: 2, explanation: "As primeiras expedições buscavam mão de obra indígena e produtos da floresta." },
        { topic: "presencaPortuguesa", question: "O que eram as 'drogas do sertão' exploradas pelos portugueses na Amazônia?", options: ["Medicamentos industrializados", "Especiarias e produtos naturais como cravo, canela, castanha", "Bebidas alcoólicas", "Pimenta e sal", "Tintas para tecidos"], correct: 1, explanation: "Eram produtos nativos de valor comercial, como especiarias, resinas e sementes, coletados na floresta." },
        { topic: "presencaPortuguesa", question: "Qual ordem religiosa atuou na criação de aldeamentos indígenas no século XVIII em Roraima?", options: ["Jesuítas", "Franciscanos", "Carmelitas", "Beneditinos", "Dominicanos"], correct: 2, explanation: "Os missionários carmelitas foram responsáveis por vários aldeamentos que serviam como estratégia de controle territorial." },
        { topic: "presencaPortuguesa", question: "O princípio do uti possidetis foi fundamental para Portugal assegurar a posse de Roraima porque:", options: ["Baseava-se em tratados com a Espanha", "Considerava a ocupação efetiva como título de posse", "Era imposto pela Igreja Católica", "Dependia de arbitragem internacional", "Foi aceito apenas no século XIX"], correct: 1, explanation: "Esse princípio garantia que quem ocupasse efetivamente o território teria direito a ele, superando o Tratado de Tordesilhas." },
        { topic: "presencaPortuguesa", question: "A Capitania de São José do Rio Negro, criada em 1755, abrangia:", options: ["Apenas o atual Amazonas", "Amazonas, Roraima e Amapá", "Amazonas e Pará", "Apenas Roraima", "Roraima e Venezuela"], correct: 1, explanation: "A capitania incluía os atuais estados do Amazonas, Roraima e Amapá, com capital em Barcelos." },
        { topic: "presencaPortuguesa", question: "Lobo D'Almada governou a Capitania de São José do Rio Negro entre:", options: ["1750-1760", "1770-1780", "1786-1799", "1800-1810", "1820-1830"], correct: 2, explanation: "Ele governou de 1786 a 1799, sendo considerado o maior governador colonial da região." },
        { topic: "presencaPortuguesa", question: "Além da pecuária, Lobo D'Almada incentivou na capitania:", options: ["Mineração de ouro", "Indústria de anil, tecidos de algodão e cordas", "Produção de borracha", "Construção naval", "Cultivo de cana-de-açúcar"], correct: 1, explanation: "Ele promoveu a indústria de anil, tecidos e cordas, diversificando a economia colonial." },
        { topic: "presencaPortuguesa", question: "O Forte de São Joaquim foi construído estrategicamente na confluência dos rios Tacutu e Uraricoera para:", options: ["Controlar o comércio de gado", "Defender a entrada do vale do Rio Branco contra invasores", "Servir como entreposto comercial", "Abrigar missões religiosas", "Funcionar como prisão"], correct: 1, explanation: "Sua localização bloqueava o acesso fluvial ao interior, protegendo a região de incursões estrangeiras." },
        { topic: "presencaPortuguesa", question: "As revoltas indígenas de 1780 em Roraima foram motivadas por:", options: ["Fome generalizada", "Superexploração da mão de obra e conflitos culturais nos aldeamentos", "Invasão holandesa", "Disputas entre tribos", "Introdução do gado"], correct: 1, explanation: "Os abusos nos aldeamentos carmelitas e a imposição cultural levaram a levantes indígenas." },
        { topic: "presencaPortuguesa", question: "Qual foi o papel do Forte de São Joaquim após o período colonial?", options: ["Tornou-se capital do estado", "Continuou como quartel até se tornar ruína histórica", "Foi transformado em museu em 1900", "Foi demolido para construir Boa Vista", "Tornou-se porto comercial"], correct: 1, explanation: "O forte entrou em decadência e hoje suas ruínas são um sítio arqueológico e patrimônio histórico." },
        { topic: "presencaPortuguesa", question: "A colonização lusa no Rio Branco foi considerada tardia em relação a outras áreas da Amazônia porque:", options: ["Não havia interesse econômico", "O foco estava no litoral e só depois na defesa da fronteira norte", "Os indígenas impediram a entrada", "O clima era muito hostil", "Faltava tecnologia naval"], correct: 1, explanation: "A ocupação foi impulsionada apenas no século XVIII, quando a ameaça estrangeira se tornou evidente." },
        { topic: "presencaPortuguesa", question: "As fazendas reais (depois nacionais) São Marcos e Casada foram criadas para:", options: ["Produção de café", "Abastecimento de carne para Manaus", "Extração de borracha", "Cultivo de arroz", "Mineração"], correct: 1, explanation: "Essas fazendas de gado foram estabelecidas para fornecer carne à capital da província." },
        { topic: "presencaPortuguesa", question: "A transferência da capital da Capitania de São José do Rio Negro de Barcelos para a barra do Rio Negro (Manaus) foi proposta por:", options: ["Ene Garcez", "Lobo D'Almada", "Inácio Lopes de Magalhães", "Augusto Ximeno de Ville Roy", "Getúlio Vargas"], correct: 1, explanation: "Lobo D'Almada idealizou a mudança para facilitar o comércio e a administração." },
        { topic: "presencaPortuguesa", question: "Os portugueses utilizavam o termo 'descimento' para designar:", options: ["A descida de boiadas para Manaus", "A remoção forçada de indígenas de suas aldeias para os aldeamentos", "A navegação pelo Rio Branco", "A fundação de cidades", "A construção de fortes"], correct: 1, explanation: "'Descimento' era a prática de trazer indígenas de suas terras para os aldeamentos controlados pelos colonizadores." },
        { topic: "presencaPortuguesa", question: "A construção do Forte de São Joaquim representou a aplicação do princípio de:", options: ["Livre comércio", "Uti possidetis", "Mare clausum", "Jus naturalis", "Pacto colonial"], correct: 1, explanation: "A ocupação militar efetiva garantia a posse do território, conforme o uti possidetis." },
        { topic: "presencaPortuguesa", question: "Em que ano Lobo D'Almada faleceu?", options: ["1775", "1789", "1799", "1804", "1815"], correct: 2, explanation: "Ele morreu em 1799, em Barcelos, deixando um legado de desenvolvimento na região." },
        { topic: "presencaPortuguesa", question: "A 1ª Brigada de Infantaria de Selva do Exército Brasileiro recebeu o nome de:", options: ["Brigada Ene Garcez", "Brigada Lobo D'Almada", "Brigada Forte São Joaquim", "Brigada Rio Branco", "Brigada Roraima"], correct: 1, explanation: "A 'Brigada Lobo D'Almada' homenageia o governador colonial que fortificou e desenvolveu a região." },
        { topic: "presencaPortuguesa", question: "A mão de obra indígena foi fundamental na colonização portuguesa do Rio Branco, principalmente na atividade:", options: ["Mineração", "Pecuária e construção de fortificações", "Navegação transatlântica", "Cultivo de especiarias", "Produção têxtil"], correct: 1, explanation: "Indígenas foram empregados como vaqueiros, remadores e na edificação de estruturas coloniais." },

        { topic: "vidaSeculoXIX", question: "Qual era a base da economia do Vale do Rio Branco no século XIX?", options: ["Extração de borracha", "Mineração de ouro", "Pecuária extensiva", "Cultivo de cacau", "Comércio de escravizados"], correct: 2, explanation: "A pecuária extensiva nos lavrados era a principal atividade econômica, com o gado criado solto." },
        { topic: "vidaSeculoXIX", question: "A Fazenda Boa Vista, embrião da capital, foi fundada em 1830 por:", options: ["Lobo D'Almada", "Inácio Lopes de Magalhães", "Augusto Ximeno de Ville Roy", "Ene Garcez", "Thomas Youd"], correct: 1, explanation: "O capitão Inácio Lopes de Magalhães estabeleceu a fazenda que deu origem à cidade de Boa Vista." },
        { topic: "vidaSeculoXIX", question: "Como era feito o transporte e a comunicação com Manaus no século XIX?", options: ["Por estradas de terra", "Por via aérea", "Exclusivamente por barcos, levando semanas", "Por telégrafo", "Por ferrovia"], correct: 2, explanation: "Os rios Negro e Branco eram as únicas vias de acesso, e a viagem de barco durava semanas." },
        { topic: "vidaSeculoXIX", question: "Qual era a população não indígena de Boa Vista por volta de 1887?", options: ["500 pessoas", "1.000 pessoas", "5.000 pessoas", "10.000 pessoas", "20.000 pessoas"], correct: 1, explanation: "Aproximadamente mil habitantes, entre militares, vaqueiros cearenses e mamelucos." },
        { topic: "vidaSeculoXIX", question: "As 'Fazendas Nacionais' como São Marcos e Casada tinham a função de:", options: ["Produzir algodão para exportação", "Abastecer Manaus com carne", "Servir como postos militares", "Extrair ouro", "Criar cavalos para o exército"], correct: 1, explanation: "Eram grandes fazendas de gado que forneciam carne para a capital da província." },
        { topic: "vidaSeculoXIX", question: "Boa Vista foi elevada à categoria de município em:", options: ["1858", "1887", "1890", "1904", "1943"], correct: 2, explanation: "Em 9 de julho de 1890, Boa Vista do Rio Branco tornou-se município do Amazonas." },
        { topic: "vidaSeculoXIX", question: "O que era a freguesia de Nossa Senhora do Carmo?", options: ["Um convento carmelita", "A primeira denominação administrativa de Boa Vista como freguesia em 1858", "Uma fazenda de gado", "Um forte militar", "Uma missão inglesa"], correct: 1, explanation: "Em 1858, o povoado foi elevado a freguesia com esse nome, antes de se tornar município." },
        { topic: "vidaSeculoXIX", question: "Qual grupo de migrantes teve papel destacado como vaqueiros no século XIX?", options: ["Portugueses", "Espanhóis", "Nordestinos (principalmente cearenses)", "Italianos", "Japoneses"], correct: 2, explanation: "Vaqueiros cearenses migraram fugindo das secas e se tornaram a principal mão de obra nas fazendas." },
        { topic: "vidaSeculoXIX", question: "Os 'coronéis do gado' formavam a elite local no século XIX, baseando seu poder:", options: ["Na produção de borracha", "No controle das grandes fazendas e do comércio fluvial", "Na mineração", "Na política partidária", "Na exportação de café"], correct: 1, explanation: "A elite era composta por grandes pecuaristas que dominavam a economia e a política regional." },
        { topic: "vidaSeculoXIX", question: "A presença do missionário inglês Thomas Youd na fronteira gerou tensões porque:", options: ["Ele incentivou a independência do Brasil", "Denunciou maus-tratos aos indígenas por colonos brasileiros", "Construiu um forte", "Introduziu o protestantismo", "Aliou-se aos holandeses"], correct: 1, explanation: "Suas denúncias sobre abusos contra indígenas criaram atritos diplomáticos entre Brasil e Inglaterra." },
        { topic: "vidaSeculoXIX", question: "O que significava 'medir distâncias pela capacidade de pasto' no contexto do século XIX?", options: ["Usar o gado como unidade de medida", "A pecuária era tão central que as posses e distâncias eram avaliadas pela área de pastagem", "Contar o número de cabeças de gado", "Utilizar o couro como moeda", "Criar mapas com rotas de boiadas"], correct: 1, explanation: "A importância do gado era tamanha que a paisagem e as propriedades eram descritas em função do pasto." },
        { topic: "vidaSeculoXIX", question: "O Forte de São Joaquim, no século XIX, funcionava principalmente como:", options: ["Centro comercial", "Centro administrativo e militar", "Escola", "Hospital", "Igreja"], correct: 1, explanation: "Era o principal ponto de defesa e administração da presença brasileira no vale." },
        { topic: "vidaSeculoXIX", question: "A mão de obra indígena no século XIX foi marcada por:", options: ["Trabalho voluntário bem remunerado", "Escravidão e trabalho forçado como vaqueiros e remadores", "Exclusão total das atividades econômicas", "Participação política ativa", "Isolamento completo"], correct: 1, explanation: "Muitos indígenas foram forçados ao trabalho braçal nas fazendas, caracterizando uma relação de exploração." },
        { topic: "vidaSeculoXIX", question: "Qual evento de 1890 foi crucial para o desenvolvimento urbano de Boa Vista?", options: ["A chegada da ferrovia", "A construção da BR-174", "A criação do município de Boa Vista do Rio Branco", "A descoberta de ouro", "A instalação do governo do Território"], correct: 2, explanation: "A elevação a município incentivou o crescimento e a organização administrativa local." },
        { topic: "vidaSeculoXIX", question: "Antes de se tornar município, Boa Vista era uma freguesia subordinada a:", options: ["Caracaraí", "Manaus", "Barcelos", "Belém", "São Luís"], correct: 1, explanation: "Como parte da Província do Amazonas, Boa Vista estava subordinada a Manaus." },
        { topic: "vidaSeculoXIX", question: "A população de Boa Vista em 1887 era composta majoritariamente por:", options: ["Fazendeiros ricos", "Militares, vaqueiros e mamelucos", "Comerciantes estrangeiros", "Religiosos", "Garimpeiros"], correct: 1, explanation: "O perfil demográfico incluía militares do forte, vaqueiros nordestinos e mestiços." },
        { topic: "vidaSeculoXIX", question: "A abertura de uma vereda ligando Boa Vista a Manaus, precursora da BR-174, ocorreu em que contexto?", options: ["No início do século XVIII", "No final do século XIX, para estimular o crescimento", "Durante a Segunda Guerra Mundial", "Na década de 1970", "Na década de 1950"], correct: 1, explanation: "No final do século XIX, uma vereda foi aberta para melhorar a comunicação, embora ainda precária." },
        { topic: "vidaSeculoXIX", question: "Qual era o principal desafio para quem vivia no Vale do Rio Branco no século XIX?", options: ["Excesso de chuvas", "Isolamento geográfico e dificuldade de comunicação", "Falta de terras férteis", "Superpopulação", "Conflitos com a Venezuela"], correct: 1, explanation: "O isolamento era extremo, com viagens longas e pouca infraestrutura." },

        { topic: "roraimaSecXX", question: "O plano urbanístico de Boa Vista em forma de leque foi projetado por:", options: ["Ene Garcez", "Darcy Aleixo Derenusson", "Lobo D'Almada", "Hélio Campos", "Ottomar Pinto"], correct: 1, explanation: "O engenheiro Darcy Derenusson desenhou o plano em 1944, inspirado em Paris." },

        { topic: "roraimaSecXX", question: "Roraima foi elevado à condição de estado pela:", options: ["Lei Complementar nº 41", "Constituição de 1988", "Decreto-Lei de 1943", "Emenda Constitucional de 1991", "Constituição de 1967"], correct: 1, explanation: "A Constituição de 1988 transformou o Território Federal de Roraima em estado." },

        { topic: "roraimaSecXX", question: "A migração nordestina para Roraima, intensificada após 1943, foi motivada principalmente por:", options: ["Descoberta de ouro", "Secas no Nordeste e promessas de terra", "Guerras no Sul", "Crise da borracha", "Construção de Brasília"], correct: 1, explanation: "As secas e os incentivos do governo para colonizar o Território atraíram muitas famílias, especialmente do Ceará e Maranhão." },

        { topic: "roraimaSecXX", question: "O conflito fundiário na Raposa Serra do Sol no final do século XX envolveu principalmente:", options: ["Garimpeiros e madeireiros", "Arrozeiros, fazendeiros e povos indígenas", "Pescadores e pecuaristas", "Comerciantes e missionários", "Militares e civis"], correct: 1, explanation: "A disputa pela terra opôs produtores de arroz e indígenas, culminando na demarcação contínua em 2009." },

    // ========== LÓGICA DO SIMULADOR ==========
    const topicSelect = document.getElementById('topicSelect');
    const startBtn = document.getElementById('startBtn');
    const selectorPanel = document.getElementById('selectorPanel');
    const quizPanel = document.getElementById('quizPanel');
    const questionText = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const feedbackBox = document.getElementById('feedbackBox');
    const resultMessage = document.getElementById('resultMessage');
    const explanationText = document.getElementById('explanationText');
    const submitBtn = document.getElementById('submitAnswerBtn');
    const nextBtn = document.getElementById('nextBtn');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const restartBtn = document.getElementById('restartBtn');
    const themeToggle = document.getElementById('themeToggle');

    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let answered = false;
    let selectedOption = null;

    // Dark mode toggle
    function applyTheme(dark) {
        if (dark) {
            document.body.classList.add('dark-mode');
            themeToggle.textContent = '☀️';
            localStorage.setItem('theme', 'dark');
        } else {
            document.body.classList.remove('dark-mode');
            themeToggle.textContent = '🌙';
            localStorage.setItem('theme', 'light');
        }
    }

    // Initialize theme (default dark as per request, but respect saved preference)
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') {
        applyTheme(false);
    } else {
        applyTheme(true); // default dark
    }

    themeToggle.addEventListener('click', () => {
        const isDark = document.body.classList.contains('dark-mode');
        applyTheme(!isDark);
    });

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
    }

    function prepareQuestions(rawQuestions) {
        return rawQuestions.map(q => {
            const order = [0, 1, 2, 3, 4];
            shuffleArray(order);
            const shuffledOptions = order.map(idx => q.options[idx]);
            const newCorrect = order.indexOf(q.correct);
            return {
                ...q,
                options: shuffledOptions,
                correct: newCorrect
            };
        });
    }

    function startQuiz() {
        const topic = topicSelect.value;
        if (!topic) {
            alert('Por favor, selecione um macro-assunto.');
            return;
        }
        const filtered = questionBank.filter(q => q.topic === topic);
        if (filtered.length < 20) {
            alert(`Atenção: este tópico possui ${filtered.length} questões.`);
        }
        currentQuestions = prepareQuestions(filtered);
        shuffleArray(currentQuestions);
        currentIndex = 0;
        score = 0;
        answered = false;
        selectorPanel.style.display = 'none';
        quizPanel.style.display = 'block';
        updateScoreDisplay();
        showQuestion();
    }

    function showQuestion() {
        if (currentIndex >= currentQuestions.length) {
            finishQuiz();
            return;
        }
        answered = false;
        selectedOption = null;
        submitBtn.style.display = 'inline-block';
        nextBtn.style.display = 'none';
        feedbackBox.style.display = 'none';
        feedbackBox.className = 'feedback';
        const q = currentQuestions[currentIndex];
        questionText.textContent = `${currentIndex + 1}. ${q.question}`;
        optionsContainer.innerHTML = '';
        q.options.forEach((opt, idx) => {
            const label = document.createElement('label');
            label.className = 'option';
            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = 'questionOption';
            radio.value = idx;
            radio.addEventListener('change', () => {
                selectedOption = idx;
            });
            label.appendChild(radio);
            label.appendChild(document.createTextNode(opt));
            optionsContainer.appendChild(label);
        });
        window.scrollTo({ top: quizPanel.offsetTop - 50, behavior: 'smooth' });
    }

    function submitAnswer() {
        if (answered) return;
        if (selectedOption === null) {
            alert('Selecione uma alternativa.');
            return;
        }
        const q = currentQuestions[currentIndex];
        const isCorrect = selectedOption === q.correct;
        if (isCorrect) {
            score++;
            resultMessage.textContent = '✅ Correto!';
            feedbackBox.className = 'feedback correct';
        } else {
            resultMessage.textContent = '❌ Incorreto!';
            feedbackBox.className = 'feedback incorrect';
        }
        const correctAnswerText = q.options[q.correct];
        explanationText.textContent = `Resposta correta: ${correctAnswerText}. ${q.explanation}`;
        feedbackBox.style.display = 'block';
        // Highlight the selected option
        const allOptions = document.querySelectorAll('.option');
        allOptions.forEach((opt, idx) => {
            const radio = opt.querySelector('input');
            if (idx === q.correct) {
                opt.style.backgroundColor = 'var(--correct-bg, #c6f6d5)';
                opt.style.borderColor = 'var(--correct-border, #38a169)';
            } else if (idx === selectedOption && !isCorrect) {
                opt.style.backgroundColor = 'var(--incorrect-bg, #fed7d7)';
                opt.style.borderColor = 'var(--incorrect-border, #e53e3e)';
            }
            radio.disabled = true;
        });
        answered = true;
        submitBtn.style.display = 'none';
        nextBtn.style.display = 'inline-block';
        updateScoreDisplay();
    }

    function nextQuestion() {
        currentIndex++;
        showQuestion();
    }

    function updateScoreDisplay() {
        scoreDisplay.textContent = `Pontuação: ${score} / ${currentQuestions.length}`;
    }

    function finishQuiz() {
        questionText.textContent = 'Simulado concluído! 🎉';
        optionsContainer.innerHTML = '';
        feedbackBox.style.display = 'none';
        submitBtn.style.display = 'none';
        nextBtn.style.display = 'none';
        scoreDisplay.textContent = `Resultado final: ${score} de ${currentQuestions.length} questões.`;
    }

    function restart() {
        currentQuestions = [];
        currentIndex = 0;
        score = 0;
        answered = false;
        quizPanel.style.display = 'none';
        selectorPanel.style.display = 'block';
        topicSelect.value = '';
        scoreDisplay.textContent = '';
    }

    startBtn.addEventListener('click', startQuiz);
    submitBtn.addEventListener('click', submitAnswer);
    nextBtn.addEventListener('click', nextQuestion);
    restartBtn.addEventListener('click', restart);
</script>
